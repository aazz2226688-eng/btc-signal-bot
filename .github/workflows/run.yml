name: BTC 自動化監測

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 * * * *'
    - cron: '0 */2 * * *'
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安裝依賴套件
        run: |
          pip install ccxt pandas numpy ta scipy requests
      - name: 執行 BTC 策略
        run: python btc_strategy.py
